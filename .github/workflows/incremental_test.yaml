name: Incremental Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Test backend for the adapter. This is the upstream query engine image;
      # it is not part of the published package.
      lake:
        image: datafuselabs/databend:nightly
        env:
          QUERY_DEFAULT_USER: lake
          QUERY_DEFAULT_PASSWORD: lake
          MINIO_ENABLED: true
        ports:
          - 8000:8000
          - 9000:9000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pip Install
        run: |
          pip install pipenv
          pip install pytest
          pip install -r dev-requirements.txt
          pipenv install --dev --skip-lock

      - name: Verify Service Running
        run: |
          cid=$(docker ps -aq --filter "ancestor=datafuselabs/databend:nightly" | head -n1)
          test -n "${cid}"
          docker logs "${cid}"
          curl -v http://localhost:8000/v1/health

      - name: dbt TiDB Cloud Lake Incremental Test Suite
        run: |
          python -m pytest -s tests/functional/adapter/incremental/test_incremental.py
