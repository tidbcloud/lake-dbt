name: Ci Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Test backend for the adapter. This is the upstream query engine image;
      # it is not part of the published package.
      lake:
        image: datafuselabs/databend:nightly
        env:
          QUERY_DEFAULT_USER: lake
          QUERY_DEFAULT_PASSWORD: lake
          # These adapter tests do not exercise object storage. Avoid the retired
          # MinIO download endpoint used by the image bootstrap.
          QUERY_STORAGE_TYPE: fs
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pip Install
        run: |
          pip install pipenv
          pip install pytest
          pip install -r dev-requirements.txt
          pipenv install --dev --skip-lock

      - name: Metadata literal regression tests
        run: python -m unittest discover -s tests/unit -v

      - name: Connection security unit tests
        run: python -m pytest --confcutdir=tests/unit -q tests/unit

      - name: Verify Service Running
        run: |
          cid=$(docker ps -aq --filter "ancestor=datafuselabs/databend:nightly" | head -n1)
          test -n "${cid}"
          if ! curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 \
            --user lake:lake \
            --header 'Content-Type: application/json' \
            --data '{"sql":"SELECT 1"}' \
            http://localhost:8000/v1/query > /tmp/lake-readiness.json; then
            docker logs "${cid}"
            exit 1
          fi
          python - <<'PYCODE'
          import json
          with open("/tmp/lake-readiness.json") as response:
              result = json.load(response)
          assert not result.get("error"), result
          assert result.get("data"), result
          PYCODE

      - name: dbt TiDB Cloud Lake Unit Test Suite
        run: |
          python -m pytest -s tests/functional/adapter/unit_testing/test_unit_testing.py
